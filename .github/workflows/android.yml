name: Android CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17 준비
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 러너에는 Android SDK가 이미 깔려 있고 라이선스도 승인되어 있습니다.
      # 필요한 플랫폼이 없으면 AGP가 내려받으므로 setup-android 액션은 쓰지 않습니다.
      - name: Android SDK 확인
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Gradle 캐시 준비
        uses: gradle/actions/setup-gradle@v6

      - name: 단위 테스트와 디버그 APK 빌드
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: 테스트 결과 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
